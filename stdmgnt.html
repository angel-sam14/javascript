<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            background-color: white;
            width: 700px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
            border: 1px solid blue;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: pink;
            color: white;
        }

        button:hover {
            background-color: hotpink;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid gray;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: pink;
        }

        .deleteBtn {
            background-color: red;
        }

        .deleteBtn:hover {
            background-color: darkred;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <input type="text" id="name" placeholder="Enter Name">

        <input type="text" id="course" placeholder="Enter Course">

        <button onclick="saveData()">Add Student</button>

        <button onclick="clearData()">Clear All</button>

        <table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="studentTable">
    </tbody>
</table>
    <script src="stdmgnt.js"></script>

</body>
</html>
